name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned toolchain (Rokit)
        uses: CompeyDev/setup-rokit@v0.1.2
        with:
          cache: true

      - name: Format check (StyLua)
        run: stylua --check src tests lune

      - name: Lint (selene)
        run: selene src tests lune

      - name: Install Lune type definitions
        run: lune setup

      - name: Type check (luau-lsp)
        run: lune run analyze

      - name: Unit tests (Lune + tiniest)
        run: lune run test

      - name: Build place (Rojo smoke test)
        run: rojo build default.project.json --output build.rbxl
